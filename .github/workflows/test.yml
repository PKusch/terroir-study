# Runs the tests and a build on every pull request, so a change can be checked
# before it reaches main (where deploy.yml publishes the site).
name: Tests

on:
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request stops the older run, which is now stale.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The tests and a build take about a minute; a stuck run stops here.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/sync-readme.mjs --check
      - run: npm run build
